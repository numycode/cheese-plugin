name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Check tag matches project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          gradle_version="$(./gradlew -q properties --property version | sed -n 's/^version: //p')"
          if [ "$tag_version" != "$gradle_version" ]; then
            echo "Tag v$tag_version does not match build.gradle.kts version ($gradle_version)." >&2
            echo "Bump the version in build.gradle.kts to match before tagging." >&2
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/libs/cheese-plugin-*.jar \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
